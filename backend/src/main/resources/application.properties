spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DB_USER:taskmanager}
spring.datasource.password=${DB_PASSWORD:taskmanager}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Bootstrap ADMIN account, seeded once when the users table is empty
# (specs/service-registry-and-task-scoping.md, rule 4). Overridable per
# environment; the defaults below apply when unset.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

# HS256 signing key for the stateless UI JWT (rule 3). Must be at least 256
# bits; overridable per environment. The placeholder below is for local
# development only and MUST be overridden in any shared environment: it is
# committed, so anyone who can read the source could forge an ADMIN token.
# JwtService logs a warning at startup while it is still in use.
app.jwt.development-secret=dGFzay1tYW5hZ2VyLWxvY2FsLWRldi1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbg==
app.jwt.secret=${JWT_SECRET:${app.jwt.development-secret}}
app.jwt.expiration=PT8H
