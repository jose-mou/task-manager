spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DB_USER:taskmanager}
spring.datasource.password=${DB_PASSWORD:taskmanager}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Bootstrap ADMIN account, seeded once when the users table is empty
# (specs/service-registry-and-task-scoping.md, rule 4). Overridable per
# environment; the defaults below apply when unset.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

# HS256 signing key for the stateless UI JWT (rule 3). Must be at least 256
# bits, base64-encoded, and set via the JWT_SECRET environment variable in
# any shared environment. No key is committed to the repository: when unset,
# JwtService generates an ephemeral one at startup and logs a warning that
# issued tokens will not survive a restart and the setup is single-instance
# only.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT8H
