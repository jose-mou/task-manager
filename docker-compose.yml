services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taskmanager
      DB_USER: taskmanager
      DB_PASSWORD: taskmanager
      # Local development only, on a par with the hardcoded database password
      # above: it keeps issued JWTs valid across backend restarts. Anyone who
      # can read this file can forge an ADMIN token, so any deployed
      # environment must export its own JWT_SECRET, which overrides this.
      JWT_SECRET: ${JWT_SECRET:-fop8YoLReSJVPHUku4LwBS6Kuouvm6I66/qAz0Taefw=}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
